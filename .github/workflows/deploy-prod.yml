name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  check-pr:
    runs-on: ubuntu-latest
    outputs:
      dev_only: ${{ steps.labels.outputs.dev_only }}
    steps:
      - name: Look up labels of the PR that produced this push
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABELS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          echo "Labels on associated PR: $LABELS"
          if echo "$LABELS" | grep -qx "dev-only"; then
            echo "dev_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev_only=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-pr
    if: needs.check-pr.outputs.dev_only != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github-test.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building app for PRODUCTION..."
          echo "NEXT_PUBLIC_ENVIRONMENT=prod" >> $GITHUB_ENV
          echo "Build complete."

      - name: Deploy to github-test.com
        run: |
          echo "Deploying commit $GITHUB_SHA to https://github-test.com"
          echo "Deploy finished. Live at https://github-test.com"

  skipped:
    needs: check-pr
    if: needs.check-pr.outputs.dev_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "Commit came from a PR labeled 'dev-only' — skipping production deploy."
