name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'dev-only')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github-test.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build
        run: |
          echo "Building app for PRODUCTION..."
          echo "NEXT_PUBLIC_ENVIRONMENT=prod" >> $GITHUB_ENV
          echo "Build complete."

      - name: Deploy to github-test.com
        run: |
          echo "Deploying PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }}) to https://github-test.com"
          echo "Deploy finished. Live at https://github-test.com"

  skipped:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'dev-only')
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "PR labeled 'dev-only' — skipping production deploy for this merge."
