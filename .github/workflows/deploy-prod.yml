name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tags.outputs.tagged }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if this commit has a git tag
        id: tags
        run: |
          TAGS=$(git tag --points-at "$GITHUB_SHA")
          echo "Tags on this commit: $TAGS"
          if [ -n "$TAGS" ]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-tag
    if: needs.check-tag.outputs.tagged != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github-test.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exclude not-yet-promoted tagged commits from the build
        run: |
          for TAG in $(git tag --merged HEAD); do
            SHA=$(git rev-list -n 1 "$TAG")
            echo "Reverting diff introduced by $TAG ($SHA) — not promoted to prod yet"
            git revert --no-commit "$SHA"
          done
          echo "Files present in src/ for this build:"
          ls src/

      - name: Build
        run: |
          echo "Building app for PRODUCTION..."
          echo "NEXT_PUBLIC_ENVIRONMENT=prod" >> $GITHUB_ENV
          echo "Build complete."

      - name: Deploy to github-test.com
        run: |
          echo "Deploying commit $GITHUB_SHA to https://github-test.com"
          echo "Deploy finished. Live at https://github-test.com"

  skipped:
    needs: check-tag
    if: needs.check-tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "Commit $GITHUB_SHA has a git tag — skipping production deploy."
